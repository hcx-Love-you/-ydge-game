name: Build Web & APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pygbag
      run: pip install pygbag

    - name: Compile Python to WebAssembly
      run: pygbag --build main.py

    # 👇 新增：给网页强行注入跨域权限，防止 WebView 卡死
    - name: Patch Index HTML for WebView
      run: |
        python -c "
        with open('build/web/index.html', 'r') as f: html = f.read()
        html = html.replace('<head>', '<head>\n<meta http-equiv=\"Cross-Origin-Opener-Policy\" content=\"same-origin\">\n<meta http-equiv=\"Cross-Origin-Embedder-Policy\" content=\"require-corp\">')
        with open('build/web/index.html', 'w') as f: f.write(html)
        "

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Capacitor and build APK
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
        
        npx cap init "废土生存" "org.ydge.ydge" --web-dir=build/web
        
        # 强制安卓 WebView 使用 https 协议加载本地文件
        node -e "const fs=require('fs'); let c=JSON.parse(fs.readFileSync('capacitor.config.json')); c.server={androidScheme:'https'}; fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));"
        
        npx cap add android
        npx cap sync android
        
        cd android
        rm -rf ~/.gradle/caches/jars-9
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydge-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
