name: Build Native Kivy APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. 开辟 4GB 虚拟内存（Swap）
    - name: Increase Swap Space
      run: |
        sudo swapoff -a
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        
    - name: Install buildozer
      run: |
        pip3 install --user --upgrade buildozer virtualenv
        pip3 install --user "cython==0.29.36" "setuptools<71.0.0"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # 2. 缓存 .buildozer 文件夹（加速下次编译，省内存）
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        
    - name: Build APK
      run: |
        rm -rf ~/.buildozer
        # 3. 限制编译并发数为 2，防止瞬间内存溢出
        export MAKEFLAGS="-j2"
        buildozer android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydge-apk
        path: bin/*.apk
