name: Build Web & APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pygbag
      run: pip install pygbag

    - name: Compile Python to WebAssembly
      run: pygbag --build main.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Capacitor and build APK
      run: |
        npm init -y
        # 锁定使用非常稳定的 Capacitor 5 版本
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
        
        npx cap init "废土生存" "org.ydge.ydge" --web-dir=build/web
        
        npx cap add android
        npx cap sync android
        
        cd android
        
        # 清理可能损坏的 Gradle 缓存文件
        rm -rf ~/.gradle/caches/jars-9
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydge-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
