name: Build Native APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build with Buildozer
      run: |
        # 清除可能残留的旧缓存
        rm -rf ~/.buildozer
        rm -rf .buildozer
        # 直接用官方容器打包，不用配任何环境
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydge-apk
        path: bin/*.apk
